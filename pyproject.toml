[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "idogcam-iptv-bridge"
version = "0.4.3"
description = "On-demand iDogCam Gingr V2 HLS compatibility bridge for IPTV clients"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.10,<4"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
